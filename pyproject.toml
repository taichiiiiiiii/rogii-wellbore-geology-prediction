[project]
name = "rogii-wellbore-geology"
version = "0.1.0"
description = "ROGII - Wellbore Geology Prediction (Kaggle). Predict TVT along horizontal wellbores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10.4",
    "tqdm>=4.66",
    "kaggle>=1.6",
    "catboost>=1.2.10",
    "numba>=0.66.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rogii"]
